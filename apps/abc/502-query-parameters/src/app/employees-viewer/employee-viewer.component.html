@let employee = (selectedEmployee | async) ?? undefined;

<article>
  <header>Employees</header>

  <app-employee-filter />

  <app-employee-list
    [list]="(filteredList | async) ?? []"
    [selectedId]="$safeNavigationMigration(employee?.id)"
  />
</article>

<app-employee-detail-view [employee]="employee" />
